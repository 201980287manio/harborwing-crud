{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<form method="post" class="form">
  {% for f in fields %}
  <label>{{ f.label }}
    {% if f.type == 'textarea' %}
      <textarea name="{{ f.name }}" rows="3" maxlength="{{ f.maxlength }}">{{ values[f.name] or '' }}</textarea>
    {% elif f.type == 'select' %}
      <select name="{{ f.name }}" {{ 'required' if f.required }}>
        {% for o in f.options %}
          {% if o is string %}{% set val = o %}{% set txt = o %}{% else %}{% set val = o[0] %}{% set txt = o[1] %}{% endif %}
          <option value="{{ val }}" {{ 'selected' if values[f.name] == val }}>{{ txt }}</option>
        {% endfor %}
      </select>
    {% else %}
      <input type="{{ f.type }}" name="{{ f.name }}" value="{{ values[f.name] if values[f.name] is not none else '' }}"
             {% if f.maxlength %}maxlength="{{ f.maxlength }}"{% endif %}
             {% if f.step %}step="{{ f.step }}"{% endif %}
             {% if f.min %}min="{{ f.min }}"{% endif %}
             {{ 'required' if f.required }} {{ 'readonly' if f.readonly }}>
    {% endif %}
  </label>
  {% endfor %}
  <div>
    <button type="submit">Save</button>
    <a href="{{ cancel_url }}">Cancel</a>
  </div>
</form>
{% endblock %}
